<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var s = localStorage.getItem('color-scheme');
        if (s === 'light' || s === 'dark') {
          document.querySelector('meta[name="color-scheme"]').content = s;
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/threads_bot/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="每日自動精選 Threads 上最熱門的男生穿搭、美式復古、阿美咔嘰貼文，由 AI 摘要整理" />
    <title>Threads 每日穿搭精選</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700;900&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
      rel="stylesheet"
    />
  </head>
